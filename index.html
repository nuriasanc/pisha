<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>El Collar de Tus Sueños</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="s1" class="screen active">
        <h1>El Collar de Tus Sueños</h1>
        <p>Empiezas con <b><span id='len'>20</span> cm</b>. Cada cualidad resta 1 cm.</p>
        <div class="wrap">
            <div id="collar"></div>
            <div class="list" id="good"></div>
        </div><button id="to2">Siguiente</button>
    </div>
    <div id="s2" class="screen">
        <h1>Ahora el grosor</h1>
        <p>Empiezas con <b><span id='wid'>0</span> cm</b>. Cada defecto suma 1 cm.</p>
        <div class="wrap">
            <div id="collar2"></div>
            <div class="list" id="bad"></div>
        </div><button id="to3">Calcular</button>
    </div>
    <div id="s3" class="screen">
        <h1>Calculando...</h1>
        <p id="calc"></p>
        <div id="result" style="display:none">
            <h2>Tu hombre ideal es...</h2>
            <h3>¡Siempre el mismo!</h3>
            <div class="card">
                <h4>Nombre del personaje</h4><textarea placeholder="Escribe aquí la descripción..."></textarea>
            </div><button onclick="location.reload()">Volver a jugar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
